[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-project-builder"
version = "0.1.0"
description = "Python-first tooling for the ETF comparison demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentic-project-builder = "agentic_project_builder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_project_builder = ["site/index.html", "site/browser-data.json", "site/fixtures/*.json", "site/src/*.js", "site/src/*.css"]

